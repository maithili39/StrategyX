version: '3.8'

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: strategyx_db
    environment:
      POSTGRES_DB: strategyx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strategyx"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MLflow Tracking Server ─────────────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strategyx_mlflow
    command: mlflow server --backend-store-uri postgresql://postgres:postgres_password@db:5432/mlflow --artifacts-destination /mlflow_artifacts --host 0.0.0.0 --port 5000 --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow_artifacts
    depends_on:
      db:
        condition: service_healthy

  # ── FastAPI Prediction Microservice ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strategyx_api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/strategyx
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - JWT_SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
    ports:
      - "8000:8000"
    volumes:
      - shared_models:/app/models
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
      redpanda:
        condition: service_healthy

  # ── Streamlit Legacy Dashboard ─────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strategyx_dashboard
    command: streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/strategyx
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    ports:
      - "8501:8501"
    volumes:
      - shared_models:/app/models
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  # ── Redpanda (Kafka-compatible Streaming Broker) ───────────────────────────
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: strategyx_redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --default-log-level=warn
    ports:
      - "19092:19092"   # External Kafka API
      - "18082:18082"   # Pandaproxy HTTP
      - "18081:18081"   # Schema Registry
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # ── Redpanda Console (UI) ─────────────────────────────────────────────────
  redpanda-console:
    image: redpandadata/console:latest
    container_name: strategyx_redpanda_console
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # ── Kafka Event Consumer Worker ────────────────────────────────────────────
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strategyx_consumer
    command: python -m src.streaming.consumer
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/strategyx
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_TOPIC=user_events
    volumes:
      - shared_models:/app/models
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # ── React + Vite Frontend ─────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: strategyx_frontend
    working_dir: /app
    command: sh -c "npm install && npm run build && npx serve -s dist -l 3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  mlflow_data:
  shared_models:
  redpanda_data:
